name: CLA

# Every author of every commit in a pull request has to have signed CLA.md
# before that pull request can be merged. This is the check that reports it;
# CONTRIBUTING.md states the requirement and CLA.md is the document.
#
# Why the enforcement has to be mechanical rather than a review habit: omul is
# dual-licensed, and the commercial half is only offerable over code whose
# rights the copyright holder holds. One unsigned outside commit merged into
# `main` removes that option for those lines permanently — there is no fix
# after the fact short of asking the author individually or deleting the code.
#
# TWO THINGS THIS FILE CANNOT DO ON ITS OWN. Both were owed before publication
# and both were done on 2026-09-07; they are recorded here rather than deleted,
# because neither lives in this repository and a fork or a restored repository
# starts without them.
#
#   1. **Bootstrap the signature store.** DONE. The action reads
#      `signatures/v1/cla.json` on the `cla-signatures` branch and its own
#      create-on-404 path is dead in v2.6.1 (it compares `error.status`, a
#      number, against the string `"404"`), so without the branch every run
#      fails with `Could not retrieve repository contents. Status: 404`. The
#      branch now exists, holding `{"signedContributors": []}`. To recreate it:
#
#        gh api -X POST repos/binaryplease/omul/git/refs \
#          -f ref=refs/heads/cla-signatures \
#          -f sha="$(gh api repos/binaryplease/omul/git/ref/heads/main --jq .object.sha)"
#        gh api -X PUT repos/binaryplease/omul/contents/signatures/v1/cla.json \
#          -f branch=cla-signatures \
#          -f message='chore: bootstrap the CLA signature store' \
#          -f content="$(printf '{"signedContributors": []}\n' | base64 -w0)"
#
#   2. **Make this check blocking.** DONE — ruleset `main: CLA required`
#      (id 22461120), enforcement active, naming this job as a required status
#      check on `refs/heads/main`. Until it existed a red CLA check did not stop
#      a merge.
#
#        gh api -X POST repos/binaryplease/omul/rulesets --input - <<'JSON'
#        {"name":"main: CLA required","target":"branch","enforcement":"active",
#         "bypass_actors":[{"actor_id":5,"actor_type":"RepositoryRole",
#           "bypass_mode":"always"}],
#         "conditions":{"ref_name":{"include":["refs/heads/main"],"exclude":[]}},
#         "rules":[{"type":"required_status_checks","parameters":{
#           "strict_required_status_checks_policy":false,
#           "required_status_checks":[
#             {"context":"Check the contributor license agreement"}]}}]}
#        JSON
#
#      THE `bypass_actors` ENTRY IS A DELIBERATE ADDITION to the command this
#      comment used to carry, and it is the one part of this worth arguing
#      about. A required status check is enforced on *direct pushes* as well as
#      on merges, and this job runs on `pull_request_target` and
#      `issue_comment` only — so it never reports on a plain push, and without a
#      bypass the ruleset would reject every push to `main`, including the merge
#      commits this project's own workflow puts there (AGENTS.md, "Branches,
#      commits and pushes"). Repository admin (`actor_id: 5`) can therefore
#      still push, and can still merge a pull request whose CLA check is red.
#      What the rule buys is that doing so is now a deliberate, logged bypass
#      instead of the default — which is exactly the posture the allowlist note
#      below describes for Dependabot. THE STANDING RULE FOR A MAINTAINER: never
#      bypass a red CLA check except for a bot's own pull request.
#
# CLA VERSION 2.0, AND THE ONE STEP IT CANNOT TAKE FROM INSIDE ITSELF. On
# 2026-09-07 the bespoke agreement was replaced by the Harmony Individual CLA
# 1.0 standard form. Two of the three halves of that move are done here:
#
#   * `CLA.md` carries the 2.0 text.
#   * `path-to-signatures` is `signatures/v2/cla.json`, bootstrapped on the
#     `cla-signatures` branch on 2026-09-07 holding `{"signedContributors": []}`
#     and read back through the contents API. The action's own create-on-404
#     path is dead, so a version bump that forgets this step fails every run
#     with an opaque 404 — bootstrap the new path first.
#
# THE THIRD IS OWED AND IT IS OWED TO WHOEVER MERGES THIS. `path-to-document`
# is a commit permalink, so it cannot name the commit that introduces the 2.0
# text until that commit exists — and this repository's commits are made by the
# post-session hook, not by the change's author (AGENTS.md, "Branches, commits
# and pushes"). So it still points at `25b4710`, which holds version **1.0**.
# Until it is re-pinned, the bot would link a signer to the wrong document
# while recording their signature against the 2.0 store. RE-PIN IT IN THE SAME
# LANDING, to the commit that carries `CLA.md` 2.0:
#
#   sed -i "s|blob/[0-9a-f]\{40\}/CLA.md|blob/$(git rev-list -1 HEAD -- CLA.md)/CLA.md|" \
#     .github/workflows/cla.yaml
#
# That is not left to a reader's diligence. `scripts/licensing.test.ts` holds
# the pin to the commit that last changed `CLA.md` and skips the assertion only
# while `CLA.md` is still uncommitted — so `mise run test` goes red the moment
# this change is committed and stays red until the re-pin lands.
#
# `signatures/v1/cla.json` stays where it is, holding its empty list. It is the
# record that nobody ever signed version 1.0, and deleting it would destroy that
# evidence rather than tidy anything. Both stores exist on `cla-signatures`,
# which serves the signature store and nothing else.
#
# THERE IS DELIBERATELY NO `allowlist:` INPUT, and adding one re-opens a full
# bypass. The action matches allowlist entries against a name that comes from
# `author.user.login` only when the commit author's email is linked to a GitHub
# account; when it is not, it falls through to the raw git author object, whose
# `name` the author sets with `git config user.name` and which GitHub never
# authenticates. An entry containing `*` becomes an *unanchored* regex, so
# `bot*` matches any name merely containing "bot", and an entry without one is
# an exact string compare a spoofed display name satisfies just as easily.
# Either way a stranger turns this check green with no signature. With no
# allowlist, an unlinked author carries `id: ''`, matches no signed record and
# stays in `notSigned` — the check fails closed, which is the whole point.
# The cost is real and accepted: Dependabot's own pull requests will show this
# check red, and a maintainer merges them on their own authority.

on:
  # `pull_request_target` rather than `pull_request`: the job needs a token that
  # can write the signature file, and a fork's `pull_request` token is
  # read-only. It runs the workflow from the *base* branch and checks out
  # nothing from the fork, so an untrusted pull request cannot alter what runs
  # here. Keep it that way — no `actions/checkout` belongs in this file.
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]

# The action never calls the commit-status or checks APIs — it signals purely
# through the job's exit status — so `statuses: write` would be reach with no
# code path behind it. `actions` is `read` rather than `write` for a subtler
# reason: on `issue_comment` the action's rerun convenience lists this
# repository's workflows and runs *unguarded* (a 403 there would fail the
# signing path), while the rerun call itself needs a PAT this workflow does not
# supply and is already wrapped in its own `.catch`. Read satisfies the first
# and denies the second.
permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  # The shared resource is one JSON file on one branch, not the pull request, so
  # the group is constant across every pull request. Keyed per pull request,
  # two runs would read-modify-write the same file concurrently and the loser
  # would take a 409 — the signature is not lost, but the contributor who signed
  # correctly sees a red check and has to know to comment `recheck`.
  # Never cancel a run in flight: it may be mid-commit.
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    name: Check the contributor license agreement
    runs-on: ubuntu-latest
    # `contains` rather than `==`: the action's own matcher compares
    # `body.trim().toLowerCase()`, so a reply with a trailing newline or
    # different capitalisation is one it would accept. An exact-equality gate
    # here would reject that reply before the job ever starts, and the
    # contributor would get no comment, no check update and no error — the
    # silent dead end CLA.md's signing instructions promise cannot happen. The
    # gate must never be stricter than the matcher it guards.
    if: >-
      github.event_name == 'pull_request_target' ||
      contains(github.event.comment.body, 'recheck') ||
      contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      # The action enumerates a pull request's authors with a single
      # `commits(first: 100)` GraphQL page and never follows `pageInfo`, so on a
      # longer pull request the authors of commits 101 and beyond are never
      # checked at all. Bound the input rather than trust the enumeration.
      # Nothing attacker-controlled is interpolated here: the condition reads an
      # integer from the event payload and the script is two literal lines.
      - name: Refuse a pull request with more than 100 commits
        if: github.event.pull_request.commits > 100
        run: |
          echo "::error::This pull request has more than 100 commits. The CLA check can only enumerate the first 100 authors, so it cannot be trusted here. Please split or squash it."
          exit 1

      # Pinned to the commit `v2.6.1` resolved to on 2026-09-02, not to the tag:
      # a tag is mutable, and this job holds a token that can push anywhere in
      # this repository. Dependabot maintains the pin (.github/dependabot.yml).
      - name: CLA assistant
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Stored in this repository on a branch of its own, so the record is
          # public and auditable by anyone deciding whether to rely on the grant
          # in CLA.md §2, and so `main` does not collect signature commits.
          #
          # `v2/` because CLA.md became version 2.0 on 2026-09-07 — the bespoke
          # text was replaced by the Harmony Individual CLA 1.0 standard form.
          # A signature recorded against one version is never counted against
          # another, which is the whole reason this path is versioned.
          #
          path-to-signatures: signatures/v2/cla.json
          branch: cla-signatures
          # A commit permalink, not `blob/main/`: the signature record stores no
          # document version, so this URL is the only evidence of what a signer
          # actually agreed to, and CLA.md's *How to sign* makes a new version
          # non-retroactive. Re-pin this to the commit that carries the new text
          # whenever CLA.md changes, and move the signature path with it.
          #
          # STALE ON PURPOSE AND GUARDED: `25b4710` holds CLA.md version 1.0,
          # and the tree's CLA.md is 2.0. The permalink cannot name the commit
          # that carries 2.0 until that commit exists, so re-pinning it is the
          # merger's job — see "THE THIRD IS OWED" in the header for the command
          # and for the test that keeps this from being forgotten. Move
          # `path-to-signatures` to a new `vN/` in the same change whenever the
          # document version changes; scripts/licensing.test.ts holds the two
          # numbers to each other so they cannot drift apart silently.
          path-to-document: https://github.com/binaryplease/omul/blob/25b4710a37001bbd33ee3949039ee0697e122721/CLA.md
          # Must stay byte-identical to the sentence quoted in CLA.md and to the
          # one in the `if:` gate above; scripts/licensing.test.ts locks all three.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: Every author on this pull request has signed the CLA. Thank you.
          lock-pullrequest-aftermerge: false
